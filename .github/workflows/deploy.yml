name: Deploy FiscoHub

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy no VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # -------------------------------------------------------------------------
      # Empacota o código-fonte como tarball gzip.
      # Exclui arquivos que NÃO devem sobrescrever o VPS:
      #   .env              → credenciais de produção (ficam no VPS)
      #   nginx/nginx.conf  → tem o domínio real substituído no VPS
      #   node_modules/     → Docker instala dentro do container
      #   .next/            → Docker gera no build
      #   .data/            → dados de produção (DB, MinIO, Redis)
      # -------------------------------------------------------------------------
      - name: Empacotar código-fonte
        run: |
          tar czf /tmp/deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.data' \
            --exclude='.env' \
            --exclude='nginx/nginx.conf' \
            --exclude='docs/superpowers' \
            .
          echo "Tarball: $(du -sh /tmp/deploy.tar.gz | cut -f1)"

      # -------------------------------------------------------------------------
      # Envia tarball via HTTPS POST para o webhook do VPS.
      # O VPS extrai os arquivos, reconstrói o container app e roda migrations.
      # Sem SSH — funciona mesmo com firewall restritivo.
      # Timeout de 10 min (docker build pode demorar).
      # -------------------------------------------------------------------------
      - name: Enviar e implantar no VPS
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/hook_response.txt -w "%{http_code}" \
            --max-time 600 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_HOOK_SECRET }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/deploy.tar.gz \
            "${{ secrets.DEPLOY_URL }}")

          echo "=== Resposta do VPS ==="
          cat /tmp/hook_response.txt
          echo ""
          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Deploy falhou (HTTP $HTTP_STATUS)"
            exit 1
          fi
