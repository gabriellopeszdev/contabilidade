name: Deploy FiscoHub

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy no VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SSH_OPTS: >-
        -i ~/.ssh/deploy_key
        -o StrictHostKeyChecking=no
        -o ServerAliveInterval=60
        -o ServerAliveCountMax=10
        -o ConnectTimeout=30

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # -------------------------------------------------------------------------
      # Configura a chave SSH privada (secret VPS_SSH_KEY no GitHub)
      # -------------------------------------------------------------------------
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # -------------------------------------------------------------------------
      # Copia apenas o código-fonte (sem .env, .data, node_modules, .next)
      # O Docker constrói node_modules e .next dentro do container.
      # O .env de produção fica no VPS e NÃO é sobrescrito.
      # -------------------------------------------------------------------------
      - name: Sincronizar código para VPS
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.data/' \
            --exclude='.env' \
            --exclude='docs/superpowers/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/contabilidade/"

      # -------------------------------------------------------------------------
      # Reconstrói e reinicia apenas o container app (sem derrubar DB/MinIO/Redis)
      # --no-deps garante que só o app é reconstruído
      # -------------------------------------------------------------------------
      - name: Reconstruir e reiniciar app
        run: |
          ssh $SSH_OPTS \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /root/contabilidade && docker compose up -d --build --no-deps app"

      # -------------------------------------------------------------------------
      # Aguarda o healthcheck confirmar que o app voltou (máx 2 minutos)
      # -------------------------------------------------------------------------
      - name: Aguardar healthcheck
        run: |
          ssh $SSH_OPTS \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'ENDSSH'
          elapsed=0
          until curl -sf http://localhost:4500/api/health > /dev/null 2>&1; do
            if [ $elapsed -ge 120 ]; then
              echo "ERRO: App não iniciou em 120s"
              docker compose -f /root/contabilidade/docker-compose.yml logs --tail=30 app
              exit 1
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "App online em ${elapsed}s"
          ENDSSH

      # -------------------------------------------------------------------------
      # Roda migrations do banco (idempotente — seguro rodar sempre)
      # -------------------------------------------------------------------------
      - name: Rodar migrations
        run: |
          ssh $SSH_OPTS \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /root/contabilidade && docker compose exec -T app npx prisma migrate deploy"

      # -------------------------------------------------------------------------
      # Remove imagens Docker antigas para liberar espaço em disco
      # -------------------------------------------------------------------------
      - name: Limpar imagens antigas
        run: |
          ssh $SSH_OPTS \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "docker image prune -f"

      - name: Status dos containers
        run: |
          ssh $SSH_OPTS \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /root/contabilidade && docker compose ps"
