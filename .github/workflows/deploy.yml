name: Deploy FiscoHub

on:
  push:
    branches: [master]
  workflow_dispatch:        # permite disparar manualmente pelo GitHub

jobs:
  deploy:
    name: Deploy no VPS
    runs-on: self-hosted

    steps:
      - name: Atualizar código
        run: |
          cd ~/contabilidade
          git pull origin master

      - name: Reconstruir e reiniciar containers
        run: |
          cd ~/contabilidade
          docker compose up -d --build --remove-orphans

      - name: Rodar migrations
        run: |
          cd ~/contabilidade
          docker compose exec -T app npx prisma migrate deploy

      - name: Limpar imagens antigas
        run: docker image prune -f

      - name: Status dos containers
        run: |
          cd ~/contabilidade
          docker compose ps
