name: Deploy FiscoHub

on:
  push:
    branches: [master]
  workflow_dispatch:        # permite disparar manualmente pelo GitHub

jobs:
  deploy:
    name: Deploy no VPS
    runs-on: self-hosted

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Copiar .env de produção
        run: cp /home/github-runner/.env $GITHUB_WORKSPACE/.env

      - name: Reconstruir e reiniciar containers
        run: docker compose up -d --build --remove-orphans

      - name: Rodar migrations do banco
        run: docker compose exec -T app npx prisma migrate deploy

      - name: Limpar imagens antigas
        run: docker image prune -f

      - name: Status dos containers
        run: docker compose ps
