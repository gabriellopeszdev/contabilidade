# =============================================================================
# Sistema de Gestão Contábil — Orquestração de Infraestrutura
# Produção / VPS Self-Hosted
#
# Uso:
#   1. Copie .env.example para .env e preencha os valores
#   2. Crie os diretórios de dados:
#        mkdir -p .data/postgres .data/redis .data/minio
#   3. docker compose up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — Banco de dados principal
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: contabilidade_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Ajustes para VPS com ~4 GB de RAM e disco SSD.
    # Altere shared_buffers e effective_cache_size conforme a RAM disponível.
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c work_mem=16MB
      -c wal_level=replica
      -c max_wal_size=1GB
      -c min_wal_size=256MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_min_duration_statement=1000
      -c log_checkpoints=on
      -c log_line_prefix='%t [%p] %u@%d '
    ports:
      # Expor apenas em localhost para não abrir a porta ao mundo.
      # Use um túnel SSH ou VPN para acesso remoto ao banco.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${DATA_DIR:-./.data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - contabilidade_net

  # ---------------------------------------------------------------------------
  # Redis 7 — Fila BullMQ + cache de sessão + pub/sub WebSocket
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: contabilidade_redis
    restart: unless-stopped
    # AOF com fsync a cada segundo: melhor equilíbrio entre durabilidade e
    # performance. Perde no máximo 1 segundo de dados em caso de falha.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --no-appendfsync-on-rewrite yes
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --loglevel notice
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ${DATA_DIR:-./.data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - contabilidade_net

  # ---------------------------------------------------------------------------
  # MinIO — Armazenamento de objetos S3-compatível (Self-Hosted)
  # Porta 9000: API S3  |  Porta 9001: Console Admin Web
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: contabilidade_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Habilita auditoria de acesso via webhook (configurável depois no console)
      MINIO_AUDIT_WEBHOOK_ENABLE: "off"
    command: server /data --console-address ":9001"
    ports:
      # API S3 — usada pela aplicação (MinIO SDK)
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      # Console Admin — acesse via túnel SSH para administrar buckets/políticas
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${DATA_DIR:-./.data}/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - contabilidade_net

  # ---------------------------------------------------------------------------
  # MinIO Init — Criação automática do bucket na primeira execução
  #
  # Este serviço roda UMA VEZ após o MinIO estar saudável, cria o bucket
  # documentos-contabeis com política privada (nenhum acesso anônimo)
  # e sai. O Docker o marca como "exited 0" e não reinicia.
  # ---------------------------------------------------------------------------
  minio_init:
    image: minio/mc:latest
    container_name: contabilidade_minio_init
    restart: on-failure
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET:        ${MINIO_BUCKET:-documentos-contabeis}
    entrypoint: >
      /bin/sh -c "
        echo '>>> Configurando alias MinIO...' &&
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&

        echo '>>> Criando bucket $${MINIO_BUCKET} (se não existir)...' &&
        mc mb --ignore-existing local/$${MINIO_BUCKET} &&

        echo '>>> Definindo política privada no bucket...' &&
        mc anonymous set private local/$${MINIO_BUCKET} &&

        echo '>>> Habilitando versionamento (proteção contra sobrescrita acidental)...' &&
        mc version enable local/$${MINIO_BUCKET} &&

        echo '>>> Bucket $${MINIO_BUCKET} configurado com sucesso.'
      "
    networks:
      - contabilidade_net

# =============================================================================
# Rede interna isolada — os serviços NÃO ficam acessíveis entre si via
# IP externo; apenas via nome de serviço dentro desta rede.
# =============================================================================
networks:
  contabilidade_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
