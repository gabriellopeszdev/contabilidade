# =============================================================================
# Sistema de Gestão Contábil — Orquestração de Infraestrutura
# Produção / VPS Self-Hosted
#
# Uso:
#   1. Copie .env.example para .env e preencha os valores
#   2. Crie os diretórios de dados:
#        mkdir -p .data/postgres .data/redis .data/minio .data/backups
#   3. docker compose up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — Banco de dados principal
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: contabilidade_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Ajustes para VPS com ~4 GB de RAM e disco SSD.
    # Altere shared_buffers e effective_cache_size conforme a RAM disponível.
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c work_mem=16MB
      -c wal_level=replica
      -c max_wal_size=1GB
      -c min_wal_size=256MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_min_duration_statement=1000
      -c log_checkpoints=on
      -c log_line_prefix='%t [%p] %u@%d '
    ports:
      # Exposto apenas no loopback do VPS — acesse via túnel SSH
      # Porta host 5434 para evitar conflito com PostgreSQL nativo do sistema
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - ${DATA_DIR:-./.data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - contabilidade_net

  # ---------------------------------------------------------------------------
  # Redis 7 — Fila BullMQ + cache de sessão + pub/sub WebSocket
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: contabilidade_redis
    restart: unless-stopped
    # AOF com fsync a cada segundo: melhor equilíbrio entre durabilidade e
    # performance. Perde no máximo 1 segundo de dados em caso de falha.
    command: >
      redis-server
      --port 6380
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --no-appendfsync-on-rewrite yes
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy noeviction
      --loglevel notice
    volumes:
      - ${DATA_DIR:-./.data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - contabilidade_net

  # ---------------------------------------------------------------------------
  # MinIO — Armazenamento de objetos S3-compatível (Self-Hosted)
  # Porta 9000: API S3  |  Porta 9001: Console Admin Web
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: contabilidade_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Habilita auditoria de acesso via webhook (configurável depois no console)
      MINIO_AUDIT_WEBHOOK_ENABLE: "off"
    command: server /data --console-address ":9001"
    ports:
      # API S3 — usada pela aplicação (MinIO SDK)
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      # Console Admin — acesse via túnel SSH para administrar buckets/políticas
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${DATA_DIR:-./.data}/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - contabilidade_net

  # ---------------------------------------------------------------------------
  # MinIO Init — Criação automática do bucket na primeira execução
  #
  # Este serviço roda UMA VEZ após o MinIO estar saudável, cria o bucket
  # documentos-contabeis com política privada (nenhum acesso anônimo)
  # e sai. O Docker o marca como "exited 0" e não reinicia.
  # ---------------------------------------------------------------------------
  minio_init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: contabilidade_minio_init
    restart: on-failure
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET:        ${MINIO_BUCKET:-documentos-contabeis}
    entrypoint: >
      /bin/sh -c "
        echo '>>> Configurando alias MinIO...' &&
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&

        echo '>>> Criando bucket $${MINIO_BUCKET} (se não existir)...' &&
        mc mb --ignore-existing local/$${MINIO_BUCKET} &&

        echo '>>> Definindo política privada no bucket...' &&
        mc anonymous set private local/$${MINIO_BUCKET} &&

        echo '>>> Habilitando versionamento (proteção contra sobrescrita acidental)...' &&
        mc version enable local/$${MINIO_BUCKET} &&

        echo '>>> Bucket $${MINIO_BUCKET} configurado com sucesso.'
      "
    networks:
      - contabilidade_net

  # ---------------------------------------------------------------------------
  # pg_backup — Backup automático do PostgreSQL
  #
  # Executa pg_dump comprimido todo dia às 02:00 UTC.
  # Retenção: 7 backups diários, 4 semanais, 6 mensais.
  # Arquivos salvos em .data/backups/ no host.
  #
  # Para restaurar manualmente:
  #   gunzip -c .data/backups/daily/contabilidade-YYYYMMDD-020000.sql.gz | \
  #     docker exec -i contabilidade_postgres psql -U postgres contabilidade
  # ---------------------------------------------------------------------------
  pg_backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: contabilidade_pg_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST:         postgres
      POSTGRES_PORT:         5432
      POSTGRES_DB:           ${POSTGRES_DB}
      POSTGRES_USER:         ${POSTGRES_USER}
      POSTGRES_PASSWORD:     ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS:   "--compress=1"
      SCHEDULE:              "0 2 * * *"
      BACKUP_KEEP_DAYS:      7
      BACKUP_KEEP_WEEKS:     4
      BACKUP_KEEP_MONTHS:    6
      HEALTHCHECK_PORT:      8080
    volumes:
      - ${DATA_DIR:-./.data}/backups:/backups
    networks:
      - contabilidade_net

  # ---------------------------------------------------------------------------
  # Aplicação Next.js — servidor customizado (Socket.IO + BullMQ)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_ASAAS_ENV: ${ASAAS_ENV:-sandbox}
    container_name: contabilidade_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      # Sobrescreve os hosts para os nomes dos serviços internos do Docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6380
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6380
      MINIO_ENDPOINT: minio
      MINIO_API_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-documentos-contabeis}
      MINIO_USE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      ASAAS_ENV: ${ASAAS_ENV:-sandbox}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN}
      PORT: ${APP_PORT:-4500}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
      # ZapSign
      ZAPSIGN_API_TOKEN: ${ZAPSIGN_API_TOKEN:-}
      ZAPSIGN_WEBHOOK_SECRET: ${ZAPSIGN_WEBHOOK_SECRET:-}
      # Cora
      CORA_ENV: ${CORA_ENV:-sandbox}
      CORA_WEBHOOK_TOKEN: ${CORA_WEBHOOK_TOKEN:-}
      # Asaas SaaS Billing: chave Asaas começa com '$', o que quebra a interpolação
      # do Docker Compose v5. Solução: .env guarda só o corpo (sem '$') em
      # ASAAS_SAAS_API_KEY_BODY; o entrypoint reconstrói com o '$' na frente.
      ASAAS_SAAS_API_KEY_BODY: ${ASAAS_SAAS_API_KEY_BODY:-}
    ports:
      - "127.0.0.1:${APP_PORT:-4500}:4500"
    volumes:
      - ${DATA_DIR:-./.data}/backups:/backups:ro
    networks:
      - contabilidade_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4500/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

# =============================================================================
# Rede interna isolada — os serviços NÃO ficam acessíveis entre si via
# IP externo; apenas via nome de serviço dentro desta rede.
# =============================================================================
networks:
  contabilidade_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
