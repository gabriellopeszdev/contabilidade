# =============================================================================
# nginx/nginx.conf — Reverse Proxy com HTTPS e WebSocket
#
# Substitua SEU_DOMINIO.com pelo domínio real em todos os lugares abaixo.
# Após obter o certificado SSL com Certbot, descomente os blocos HTTPS.
# =============================================================================

# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name SEU_DOMINIO.com www.SEU_DOMINIO.com;

    # Necessário para o Certbot validar o domínio (ACME challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona todo o resto para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — proxy para o Next.js + WebSocket do Socket.IO
server {
    listen 443 ssl;
    server_name SEU_DOMINIO.com www.SEU_DOMINIO.com;

    # Certificados gerados pelo Certbot
    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO.com/privkey.pem;

    # Configurações SSL modernas (TLS 1.2+)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — força HTTPS por 1 ano
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Oculta versão do servidor e cabeçalhos internos do Next.js
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    proxy_hide_header X-Powered-By;
    server_tokens off;

    # Tamanho máximo de upload (10MB por arquivo × até 50 arquivos = 500MB por lote)
    client_max_body_size 500M;

    # Timeouts generosos para uploads grandes
    proxy_read_timeout    300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;

    # -------------------------------------------------------------------------
    # WebSocket — Socket.IO (/api/ws)
    # DEVE vir antes do bloco / genérico
    # -------------------------------------------------------------------------
    location /api/ws {
        proxy_pass         http://app:4500;
        proxy_http_version 1.1;

        # Upgrade HTTP → WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO usa long-polling como fallback — timeouts maiores
        proxy_read_timeout 3600s;
    }

    # -------------------------------------------------------------------------
    # Aplicação Next.js (todas as demais rotas)
    # -------------------------------------------------------------------------
    location / {
        proxy_pass         http://app:4500;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necessário para SSE e streaming do Next.js
        proxy_buffering    off;
        proxy_cache        off;
    }
}
