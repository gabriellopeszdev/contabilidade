# =============================================================================
# nginx-502.conf — Cole este trecho na configuração do seu proxy reverso
#                  (Portainer Nginx / HestiaCP) para que durante o deploy
#                  o usuário veja uma tela de "carregando" ao invés de 502.
#
# No HestiaCP: Configurações → Web → Domínio → Nginx → "Configuração extra"
# No Nginx Proxy Manager: Proxy Host → Advanced → Custom Nginx Configuration
# =============================================================================

# Intercepta erros de upstream (app reiniciando)
proxy_intercept_errors on;

error_page 502 503 504 @atualizando;

location @atualizando {
    default_type 'text/html; charset=utf-8';
    add_header Cache-Control "no-store, no-cache";
    add_header Retry-After "10";
    return 200 '<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="5">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atualizando...</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:#f8fafc;display:flex;align-items:center;
         justify-content:center;min-height:100vh;margin:0;color:#334155}
    .c{text-align:center;background:#fff;border-radius:1.5rem;
       padding:3rem 2.5rem;box-shadow:0 4px 24px rgba(0,0,0,.07);max-width:340px;width:90%}
    .s{width:44px;height:44px;border:4px solid #e2e8f0;border-top-color:#2563eb;
       border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1.5rem}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:1.05rem;font-weight:700;margin-bottom:.5rem}
    p{font-size:.875rem;color:#64748b;line-height:1.5}
  </style>
</head>
<body>
  <div class="c">
    <div class="s"></div>
    <h1>Sistema sendo atualizado</h1>
    <p>Isso levará apenas alguns segundos.<br>A página recarregará automaticamente.</p>
  </div>
</body>
</html>';
}
